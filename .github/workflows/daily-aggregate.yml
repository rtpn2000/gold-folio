name: Daily Price Aggregate

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Call deployed aggregate endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 20 \
            --connect-timeout 30 \
            --max-time 180 \
            "${{ secrets.APP_URL }}/aggregate"
